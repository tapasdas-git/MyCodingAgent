[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MyCodingAgent"
version = "0.1.0"
description = "CLI tool for MyCodingAgent task management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Add third-party packages here, e.g. ["requests>=2.28.0"]

[project.scripts]
# This lets you run 'mycodeagent' directly in your terminal
mycodeagent = "mycodeagent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
