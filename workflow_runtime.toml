name = "mycodeagent"
platform_version = "omnigent 0.5.1"

[workflow]
max_cycles = 5

[defaults]
harness = "codex"
model = "gpt-5.4-mini"
effort = "high"
time_limit_seconds = 1200

[paths]
# Relative paths are resolved from the primary repository root.
worktree_root = "../CodedWorkspace"

[agents.explorer]
read_only = true
effort = "medium"

[agents.implementer]
write_scope = "coding_and_authorized_tests"

[agents.test_writer]
write_scope = "tests"

[agents.reviewer]
read_only = true
