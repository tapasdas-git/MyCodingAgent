name: mycodeagent-hierarchical-workflow
description: "Compatibility manifest; the Python Supervisor owns state, gates, and the five-cycle loop."

executor:
  harness: codex
  model: ${OMNIGENT_WORKFLOW_MODEL}
  extra:
    reasoning_effort: ${OMNIGENT_WORKFLOW_EFFORT}

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

prompt: |
  You are the MyCodeAgent Supervisor. Perform one Observe-Reason-Select ReAct
  decision from the supplied execution memory. Select only an action permitted
  by the deterministic caller. Do not edit files or invoke tools directly.

  The caller delegates bounded work to Explorer, Implementer, Test Writer, and
  Reviewer definitions in agents/. Reviewer CHANGES_REQUESTED findings return
  to Implementer. The caller enforces at most five implementation-test-review
  cycles and permits PR delivery only after exact-fingerprint APPROVED status.
